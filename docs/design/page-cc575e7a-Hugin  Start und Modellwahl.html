body{margin:0;background:#0E0F12}
*{box-sizing:border-box}
a{color:#EE9A3C}a:hover{color:#F7BE6E}

textarea::placeholder{color:#8E8A80}
textarea:focus{outline:none}
button:focus-visible,textarea:focus-visible{outline:2px solid #ECE6D9;outline-offset:2px}
@keyframes breathe{0%,100%{transform:scale(.88);opacity:.85}50%{transform:scale(1.06);opacity:1}}
@keyframes halo{0%,100%{opacity:.5;transform:scale(.88)}50%{opacity:1;transform:scale(1.18)}}
